// =====================
// BANCO DE DADOS
// =====================


let dados = {


consultas:[],


exames:[],


transportes:[],


pacientes:[]


};





function salvarDados(){


localStorage.setItem(
"telemed",
JSON.stringify(dados)
);


}





function carregarDados(){


let salvo =
localStorage.getItem("telemed");



if(salvo){


dados =
JSON.parse(salvo);


}


if(!dados.pacientes){

dados.pacientes = [];

}


}



carregarDados();







// =====================
// LOGIN
// =====================



function entrar(){


let usuario =
document.getElementById("usuario").value;



let senha =
document.getElementById("senha").value;




let encontrado =
usuarios.find(u =>
u.usuario==usuario && u.senha==senha
);



if(!encontrado){


alert("Usuário ou senha incorretos");


return;


}



if(encontrado.tipo=="paciente"){

abrirPaciente();

}

else if(encontrado.tipo=="medico"){

abrirMedico();

}

else if(encontrado.tipo=="motorista"){

abrirMotorista();

}

else if(encontrado.tipo=="admin"){

abrirAdmin();

}

else{

alert("Tipo de usuário desconhecido: "+encontrado.tipo);

}



}

function marcarConsulta(){



document.getElementById("conteudoPaciente").innerHTML=`

background:white;
padding:20px;
border-radius:15px;
">

📅 Nova Consulta

<input id="dataConsulta"
type="date">

Salvar Consulta

</button>

`;

function salvarConsulta(){



let paciente = document.getElementById("nomeConsulta").value;
let medico = document.getElementById("medicoConsulta").value;
let data = document.getElementById("dataConsulta").value;
let hora = document.getElementById("horaConsulta").value;

alert("Preencha todos os campos antes de salvar.");

return;

}



let consulta={


paciente:
paciente,


medico:
medico,


data:
data,


hora:
hora,


status:
"Agendada"


};



dados.consultas.push(consulta);


salvarDados();



alert("Consulta marcada!");


abrirPaciente();



}

// =====================

function verMeusDados(){


let html = `


<div style="
background:white;
padding:20px;
border-radius:15px;
">


<h2>
📋 Meus Registros
</h2>


<h3 style="margin-top:15px">📅 Consultas</h3>

`;


if(dados.consultas.length==0){

html += `<p>Nenhuma consulta registrada.</p>`;

}


dados.consultas.forEach((c,index)=>{

let statusC = c.status || "Agendada";

html += `

<div style="
background:#eef6ff;
padding:12px;
border-radius:10px;
margin:8px 0;
">

<b>Médico:</b> ${c.medico || "-"} ${c.especialidade ? "("+c.especialidade+")" : ""}<br>
<b>Data:</b> ${c.data} &nbsp; <b>Hora:</b> ${c.hora}<br>
<b>Status:</b> ${statusC}

${statusC!="Cancelada" && statusC!="Realizada" ? `
<br><br>
<button onclick="cancelarConsultaPaciente(${index})"
style="background:#ff6b6b">
🚫 Cancelar Consulta
</button>
` : ""}

</div>

`;

});


html += `<h3 style="margin-top:15px">🧪 Exames</h3>`;


if(dados.exames.length==0){

html += `<p>Nenhum exame registrado.</p>`;

}


dados.exames.forEach((e,index)=>{

let statusE = e.status || "Solicitado";

html += `

<div style="
background:#eef6ff;
padding:12px;
border-radius:10px;
margin:8px 0;
">

<b>Tipo:</b> ${e.tipo}<br>
<b>Data:</b> ${e.data}<br>
<b>Status:</b> ${statusE}

${statusE!="Cancelado" && statusE!="Concluído" ? `
<br><br>
<button onclick="cancelarExamePaciente(${index})"
style="background:#ff6b6b">
🚫 Cancelar Exame
</button>
` : ""}

</div>

`;

});


html += `<h3 style="margin-top:15px">🚐 Transportes</h3>`;


if(dados.transportes.length==0){

html += `<p>Nenhum transporte solicitado.</p>`;

}


dados.transportes.forEach((t,index)=>{

let statusT = t.status || "Aguardando motorista";

html += `

<div style="
background:#eef6ff;
padding:12px;
border-radius:10px;
margin:8px 0;
">

<b>Endereço:</b> ${t.endereco}<br>
<b>Destino:</b> ${t.destino}<br>
<b>Status:</b> ${statusT}

${statusT!="Cancelado" && statusT!="Finalizado" ? `
<br><br>
<button onclick="cancelarTransportePaciente(${index})"
style="background:#ff6b6b">
🚫 Cancelar Transporte
</button>
` : ""}

</div>

`;

});


html += `

<br>

<button onclick="abrirPaciente()"
style="background:#999">

⬅ Voltar

</button>

</div>

`;


document.getElementById("conteudoPaciente").innerHTML = html;


}


function cancelarConsultaPaciente(index){

if(!confirm("Deseja realmente cancelar esta consulta?")){
return;
}

dados.consultas[index].status = "Cancelada";

salvarDados();

verMeusDados();

}


function cancelarExamePaciente(index){

if(!confirm("Deseja realmente cancelar este exame?")){
return;
}

dados.exames[index].status = "Cancelado";

salvarDados();

verMeusDados();

}


function cancelarTransportePaciente(index){

if(!confirm("Deseja realmente cancelar este transporte?")){
return;
}

dados.transportes[index].status = "Cancelado";

salvarDados();

verMeusDados();

}

function verAgendaMedico(){



let html=`


<div style="
background:white;
padding:20px;
border-radius:15px;
">


<h2>
📋 Agenda
</h2>


<input id="buscaAgendaMedico"
placeholder="🔎 Buscar paciente..."
oninput="filtrarAgendaMedico()"
style="margin-bottom:15px">

if(dados.consultas.length==0){


html+=`

<p>
Nenhuma consulta marcada.
</p>

`;



}



dados.consultas.forEach((c,index)=>{


let status = c.status || "Agendada";

let corStatus = "#3742fa";

if(status=="Realizada"){ corStatus="#2ed573"; }
if(status=="Cancelada"){ corStatus="#ff4757"; }


html+=`


<div class="cardConsulta"
data-paciente="${c.paciente.toLowerCase()}"
style="
background:#eef6ff;
padding:15px;
border-radius:10px;
margin:10px 0;
">


<b>Paciente:</b>
${c.paciente}


<br>


<b>Especialidade:</b>
${c.especialidade || "Consulta"}


<br>


<b>Data:</b>
${c.data}


<br>


<b>Hora:</b>
${c.hora}


<br><br>


<span style="
background:${corStatus};
color:white;
padding:5px 12px;
border-radius:12px;
font-size:13px;
">
${status}
</span>


<br><br>


<button onclick="editarConsulta(${index})"
style="background:#ffa502">

✏️ Editar

</button>


<button onclick="iniciarVideochamada(${index},'medico')"

</button>

🚫 Cancelar

</button>

style="background:#ff4757">

</button>


<button onclick="verDetalhesConsulta(${index})"
style="background:#54a0ff">

🔎 Ver Detalhes

</button>


<button onclick="adicionarDetalhesConsulta(${index})"
style="background:#a29bfe">

📝 Adicionar Observação

</button>



</div>


`;



});



html+=`</div>`;


document.getElementById("conteudoMedico").innerHTML=html;



}


function filtrarAgendaMedico(){


let termo =
document.getElementById("buscaAgendaMedico").value.toLowerCase();


let cards =
document.querySelectorAll(".cardConsulta");


cards.forEach(card=>{


let paciente = card.getAttribute("data-paciente");


if(paciente.includes(termo)){

card.style.display="block";

}else{

card.style.display="none";

}


});


}




function excluirConsulta(index){


if(!confirm("Deseja realmente excluir esta consulta?")){

return;

}


dados.consultas.splice(index,1);


salvarDados();


verAgendaMedico();


}

// EDITAR CONSULTA

function editarConsulta(index){


let c = dados.consultas[index];


document.getElementById("conteudoMedico").innerHTML = `


<div style="
background:white;
padding:20px;
border-radius:15px;
">


<h2>

</h2>

placeholder="Nome do paciente"
value="${c.paciente}">


<input id="editEspecialidade"
placeholder="Especialidade"
value="${c.especialidade || ""}">

<input id="editData"
type="date"
value="${c.data}">


<label>Hora da consulta</label>
<input id="editHora"
type="time"
value="${c.hora}">


<button onclick="salvarEdicaoConsulta(${index})">

💾 Salvar Alterações

</button>


<button onclick="verAgendaMedico()"
style="background:#999">

Cancelar

</button>

`;

function salvarEdicaoConsulta(index){


let paciente = document.getElementById("editPaciente").value;
let especialidade = document.getElementById("editEspecialidade").value;
let data = document.getElementById("editData").value;
let hora = document.getElementById("editHora").value;


if(!paciente || !data || !hora){

alert("Preencha nome, data e hora.");

return;

}


dados.consultas[index].paciente = paciente;
dados.consultas[index].especialidade = especialidade;
dados.consultas[index].data = data;
dados.consultas[index].hora = hora;


salvarDados();


alert("Consulta atualizada!");


verAgendaMedico();


}


// =====================
// STATUS DA CONSULTA
// =====================


function definirStatusConsulta(index, status){


dados.consultas[index].status = status;


salvarDados();


verAgendaMedico();


}


// =====================
// VIDEOCHAMADA SIMULADA
// =====================


let segundosVideo = 0;

let timerVideo = null;


function iniciarVideochamada(index, origem){


clearInterval(timerVideo);

segundosVideo = 0;


let c = dados.consultas[index];


document.getElementById("sistema").innerHTML = `


<div style="
padding:25px;
text-align:center;
color:white;
background:#111;
min-height:100vh;
">


<h1>
📹 Consulta em Andamento
</h1>


<p>
Paciente: ${c.paciente} — ${c.especialidade || "Consulta"}
</p>


<div style="
background:#222;
height:280px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
margin:25px auto;
max-width:400px;
">

🧑‍⚕️

</div>


<div style="
background:#0066ff;
display:inline-block;
padding:10px 25px;
border-radius:20px;
font-size:20px;
">

⏱️ <span id="tempoVideo">00:00</span>

</div>


<br><br><br>


<button onclick="encerrarVideochamada('${origem}')"
style="background:#ff4757;max-width:300px;">

📴 Encerrar Consulta

</button>


</div>


`;


timerVideo = setInterval(()=>{


segundosVideo++;


let m = String(Math.floor(segundosVideo/60)).padStart(2,"0");

let s = String(segundosVideo%60).padStart(2,"0");


let el = document.getElementById("tempoVideo");


if(el){

el.innerText = m+":"+s;

}


},1000);


}




function encerrarVideochamada(origem){


clearInterval(timerVideo);


alert("Consulta encerrada!");


document.getElementById("sistema").style.display="block";


if(origem=="medico"){

abrirMedico();

}else{

abrirPaciente();

}


}
